# Single-binary Loki for local use. Filesystem storage and no replication:
# this is a development stack, and losing its logs on `down -v` costs nothing.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Every attribute the application sets becomes queryable without being a
  # stream label, which is what keeps job_id - high cardinality by nature -
  # from exploding the index.
  allow_structured_metadata: true
  volume_enabled: true
