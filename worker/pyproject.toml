[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prateekh-spec", email = "hitliprateek6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.83",
    "fastapi>=0.141.1",
    # Used directly by app/core/auth.py and app/enrichment/. It arrived
    # transitively before, which made it one dependency bump from vanishing.
    "httpx>=0.28.1",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    # Required by FastAPI to parse the multipart body of POST /api/v1/images/upload.
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

# Optional: the observability stack (docs/audits/audit-01-backend.md 18). Kept out of the base
# dependency set because it is the largest addition this project has taken and
# nothing in the app requires it - setup_telemetry() no-ops when
# OTEL_EXPORTER_OTLP_ENDPOINT is unset, which is how the tests and the eval
# harness run. Install with `uv sync --extra otel`.
[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-botocore>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
]

# Not a distributable package. There is no src/ layout to build: the real
# code is app/ off the working directory, and every entrypoint is
# `python -m app.X`. This is the declared form of what Dockerfile has
# always done with --no-install-project.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.83",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "types-python-jose>=3.5.0.20260408",
    "types-pyyaml>=6.0.12.20260815",
    "websockets>=17.1",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection contract is `= Depends(...)` in a
# default, so B008 is a false positive on every route. This is the setting
# ruff provides for it; the alternative is a noqa on every handler.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

# The otel extra is optional on purpose, so a base install has no stubs for
# it and every import in app/telemetry is unresolvable. That is the intended
# state, not an error: the code guards each import and falls back to a no-op.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "eval: hits the real model API, costs money, needs Docker",
    "integration: needs DynamoDB Local (8000), ElasticMQ (9324), Redis (6379)",
]
