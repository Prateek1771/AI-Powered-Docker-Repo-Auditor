[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prateekh-spec", email = "hitliprateek6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
worker = "worker:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "eval: hits the real model API, costs money, needs Docker",
]
