[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prateekh-spec", email = "hitliprateek6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.83",
    "fastapi>=0.141.1",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "pydantic>=2.13.4",
    "python-jose[cryptography]>=3.5.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
worker = "worker:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.83",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "types-python-jose>=3.5.0.20260408",
    "types-pyyaml>=6.0.12.20260815",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection contract is `= Depends(...)` in a
# default, so B008 is a false positive on every route. This is the setting
# ruff provides for it; the alternative is a noqa on every handler.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "eval: hits the real model API, costs money, needs Docker",
    "integration: needs DynamoDB Local on port 8000",
]
