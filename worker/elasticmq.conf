include classpath("application.conf")

node-address {
    protocol = http
    host = "localhost"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

# Queue names are quoted: HOCON treats an unquoted dot as a path separator,
# so scan-jobs.fifo would parse as scan-jobs { fifo { ... } }.
queues {
    "scan-jobs.fifo" {
        fifo = true
        contentBasedDeduplication = false
        deadLettersQueue {
            name = "scan-jobs-dlq.fifo"
            maxReceiveCount = 3
        }
    }

    "scan-jobs-dlq.fifo" {
        fifo = true
        contentBasedDeduplication = false
    }
}
