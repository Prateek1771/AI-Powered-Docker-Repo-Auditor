services:
  dynamodb:
    image: amazon/dynamodb-local
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    user: root
    volumes:
      - dynamodb-data:/data
    ports:
      - "8000:8000"

  elasticmq:
    image: softwaremill/elasticmq-native
    volumes:
      - ./worker/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9324:9324"
      - "9325:9325"

  redis:
    image: redis:7-alpine
    # Passworded locally too, not just in AWS. A credential that only exists in
    # the deployed config is never exercised, and the AUTH/health-check
    # interaction below is exactly the sort of thing that then breaks on first
    # deploy. 6379 is also published to the host here.
    #
    # The :-localdev default keeps a fresh clone working. Without it an unset
    # variable substitutes empty, `--requirepass ""` disables auth, and the
    # stack would come up silently unauthenticated - which is worse than not
    # doing this at all.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localdev}"]
    environment:
      # redis-cli reads this by itself, so the health check needs no -a and the
      # token stays out of its argv.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-localdev}
    ports:
      - "6379:6379"
    healthcheck:
      # grep, not the exit code: an unauthenticated ping prints NOAUTH, and a
      # health check that cannot tell those apart lets api and worker start
      # against a Redis they cannot use - both gate on service_healthy.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10

  # One shot. DynamoDB Local has no healthcheck of its own, so the loop is the
  # readiness wait - create_tables is already idempotent (it checks for the
  # tables and for an existing TTL setting before touching either).
  bootstrap:
    image: auditor-api:latest
    build:
      context: ./worker
      target: api
    command: ["sh", "-c", "until python -m app.scripts.create_tables; do echo 'waiting for dynamodb'; sleep 2; done"]
    restart: "no"
    # Inherited from the api image, where it curls a port this container never
    # opens. A one-shot job is healthy by exiting 0, not by answering requests.
    healthcheck:
      disable: true
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
    depends_on:
      - dynamodb

  api:
    image: auditor-api:latest
    build:
      context: ./worker
      target: api
    environment:
      DEV_AUTH: "1"
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SCAN_QUEUE_URL: http://elasticmq:9324/000000000000/scan-jobs.fifo
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
      BLOB_DIR: /data/blobs
      JWKS_URL: http://127.0.0.1:8080/dev/.well-known/jwks.json
      CORS_ORIGINS: http://localhost:3000
      # Empty unless you set it, and empty means telemetry is off: the app
      # keeps its previous behaviour exactly. Set it (see example.env) and
      # bring the stack up with `--profile observability`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-}
    volumes:
      # Same socket the worker takes, for the same reason and with the same
      # caveat: the "My images" picker lists the host daemon's images, and this
      # grants the container root on the host. Local development only - the
      # Fargate task runs SCANNER_MODE=registry, where the route 404s.
      - /var/run/docker.sock:/var/run/docker.sock
      - blobs:/data/blobs
      # DEV_AUTH only. app/dev/keys.py writes a signing key to .dev-keys
      # relative to CWD, which the read-only root blocks. That path does not
      # exist on Fargate - DEV_AUTH is unset there and CI asserts /dev/token
      # returns non-200 after every deploy - so this is the local-only cost of
      # running the deployed hardening locally. Long syntax for the mode: a
      # bare tmpfs lands root-owned 0755 and this process is uid 1001.
      - type: tmpfs
        target: /app/.dev-keys
        tmpfs:
          mode: 0777
    group_add:
      - "0"
    # The same hardening the Fargate task definitions apply, so it is exercised
    # here rather than discovered on deploy. The images already run as uid 1001;
    # read_only + tmpfs is what proves nothing writes outside /tmp and the
    # mounted volumes. See docs/AUDIT.md P4-4.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # The host port is a variable because it is the SAME FACT as the URL baked
      # into the frontend bundle below, and two copies of one fact drift. They
      # did: an override published this on 18080 while the bundle still pointed
      # at 8080, so the UI called a port the API was not on. Set API_PORT once.
      - "${API_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully

  worker:
    image: auditor-worker:latest
    build:
      context: ./worker
      target: worker
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SCAN_QUEUE_URL: http://elasticmq:9324/000000000000/scan-jobs.fifo
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
      BLOB_DIR: /data/blobs
      ENRICHMENT_CACHE_DIR: /tmp/enrichment-cache
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Empty means "call OpenAI directly". Set (see example.env) and every
      # agent routes through the gateway instead.
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-}
    volumes:
      # The worker runs Trivy and `docker history` as sibling containers, so it
      # needs the host daemon. This grants the container root on the host -
      # acceptable for local development, and the reason Phase 12 replaces it
      # with Trivy reading a registry instead of a daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Reports are written here by the worker and read back by the API. One
      # volume, both services - without it every /report returns nothing.
      - blobs:/data/blobs
    # The image runs as uid 1001 so it passes its own CIS 4.1 check. The socket
    # is root-owned, so the process needs gid 0 to reach it.
    group_add:
      - "0"
    # The same hardening the Fargate task definitions apply, so it is exercised
    # here rather than discovered on deploy. The images already run as uid 1001;
    # read_only + tmpfs is what proves nothing writes outside /tmp and the
    # mounted volumes. See docs/AUDIT.md P4-4.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully

  frontend:
    image: auditor-frontend:latest
    build:
      context: ./frontend
      args:
        # Baked into JavaScript that runs in the browser, which is outside this
        # network and cannot resolve `api`. Service names work container to
        # container; browser-facing URLs must be reachable from the host.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8080}
        NEXT_PUBLIC_WS_URL: ws://localhost:${API_PORT:-8080}
        # Browser-facing, so it must be the published address rather than the
        # service name. Empty hides the Grafana tab entirely.
        NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL-http://localhost:3001}
        # Empty locally, which is what selects the DEV_AUTH token path. Set
        # both (terraform output cognito_user_pool_id / cognito_client_id) and
        # the UI asks for a real sign-in instead. See docs/AUDIT_02 F1.
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${NEXT_PUBLIC_COGNITO_USER_POOL_ID-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${NEXT_PUBLIC_COGNITO_CLIENT_ID-}
    environment:
      # Server-side only, deliberately not NEXT_PUBLIC_: the analytics route
      # handler queries Prometheus over this network and returns JSON, so the
      # browser never talks to Prometheus and Prometheus is never published to
      # it. An open PromQL endpoint is the wrong thing to ship from a product
      # whose whole job is finding those.
      PROMETHEUS_URL: ${PROMETHEUS_URL-http://prometheus:9090}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # The LLM gateway. Every model call in this project goes through
  # build_client() in app/agents/runner.py, so pointing that one client at
  # this one container puts all six agents, the CLI and the eval harness
  # behind a gateway at once.
  #
  # Not behind a profile, but the application does not require it: with
  # LLM_GATEWAY_URL unset the agents talk to OpenAI directly exactly as
  # before, which is what keeps the test suite and CI unaffected.
  #
  # Published on 8085 rather than its native 8080, which the API already owns.
  bifrost:
    image: maximhq/bifrost
    environment:
      # Auto-detected on boot and registered as a provider key - no config
      # file needed for the single-provider case. Add ANTHROPIC_API_KEY and
      # it becomes a failover target, which is the point: an exhausted key
      # stops being an outage.
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
    volumes:
      # config.db is a SQLite file holding providers, keys, budgets and
      # routing rules. On a fresh volume the gateway starts empty and
      # re-detects from the environment, so losing it costs configuration
      # done through the web UI, not the ability to run.
      - bifrost-data:/app/data
    ports:
      - "${BIFROST_PORT:-8085}:8080"

  # --- observability, behind a profile -------------------------------------
  #
  # `docker compose up` starts none of these and behaves exactly as it did
  # before. `docker compose --profile observability up` adds them. Four
  # containers of memory is a real cost and nobody should pay it for a scan
  # they are not measuring. See docs/AUDIT.md 18.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Published so a scan run from the host (the CLI, the eval harness) can
      # push to the same collector the containers use.
      - "4318:4318"
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Needed by the Grafana panels that query recent data at a fine
      # resolution; without it Prometheus refuses ranges under 10s.
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Without this the 15d retention above is fiction: the TSDB lives in the
      # container's writable layer and a restart or an image bump discards it.
      # A regression signal you cannot compare against last week is not one.
      # See docs/AUDIT_02 F6.
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.4.2
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      # 3101 on the host: 3100 is a common default and collides readily
      # (Grafana's own agent, other local stacks). Grafana and the collector
      # both reach Loki as loki:3100 on this network regardless.
      - "3101:3100"

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    environment:
      # Local only. There is nothing in this stack worth a password and a
      # login prompt in front of a development dashboard is friction with no
      # security value - it is bound to localhost either way.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Grafana sends X-Frame-Options: deny by default, which blocks the
      # Analytics tab's embed. Safe here for the same reason anonymous admin
      # is: this binds to localhost and holds nothing worth taking.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3001, because the frontend already owns 3000.
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  dynamodb-data:
  blobs:
  prometheus-data:
  loki-data:
  bifrost-data:
